# ============================================================================
# PROVISIONAL, written 2026-09-06, waiting on Mo's approval.
# The five books below are decided (Mo, 2026-09-06). Every number inside the
# strategy folders they point at is still a proposal, and every strategy.yaml
# says so at the top with status: provisional.
# ============================================================================
#
# What this file is: the register of the five virtual books that share one IBKR
# paper account. A book is a strategy, a pot of money, and a tag that goes on
# every order it sends so a fill can always be traced back to it.
#
# Books A, B and E all run the opening momentum strategy. What changes between
# them is who makes the call: A asks Claude Fable, E asks GPT-6 Astra, and B
# asks nobody and follows the rules alone. That is the comparison month one is
# for, so their numbers have to stay identical and only the model may differ.
#
# ---------------------------------------------------------------------------
# MODES, AND HOW A BOOK GETS PROMOTED
# ---------------------------------------------------------------------------
#
# Every book has a mode, and it is one of three words:
#
#   dry_run   The book works out the order it would have sent, writes it down,
#             and stops there. Nothing reaches the broker. Sizing still uses the
#             book's full capital_usd, because a rehearsal that sizes its orders
#             differently from the real thing is not a rehearsal.
#   tiny      Real orders in the paper account, but the book is only allowed to
#             risk money.tiny_capital_usd, which is 2,000 dollars in
#             config/guardrails.yaml. Everything is sized against that pot
#             instead of the book's capital, so a bug is cheap.
#   full      Real orders in the paper account against the book's whole
#             capital_usd.
#
# ALL FIVE BOOKS ARE ON dry_run TODAY (2026-09-06), and that is deliberate.
#
# PROMOTION IS NEVER AUTOMATIC. No code anywhere moves a book from dry_run to
# tiny, or from tiny to full. Nothing watches a book's results and decides it
# has earned it. A promotion is Mo editing this file by hand, one book at a
# time, after the hub has approved that book.
#
# When the hub approves a book, two fields get stamped on it here at the same
# time as the mode changes:
#
#   promoted_on    the date the hub approved it, written as 2026-10-13
#   rules_commit   the git hash of the rules it was approved against, so there
#                  is no argument later about which version of the numbers and
#                  the guardrails was signed off
#
# rules_commit is stamped on books A, B and E as of 2026-09-06: b04298a. It says
# WHICH RULES THE BOOK RUNS. It is not a promotion: promoted_on is still empty on
# all five books, every one of them is still on dry_run, and a book cannot be set
# to tiny or full without both fields filled in. Books C and D keep an empty
# stamp because their numbers were not part of Mo's approval.
#
# WHEN TO MOVE IT (Mo, 2026-09-06). The stamp has to name the tree as it actually
# stands, not the moment somebody said yes. It was first set to 273e928, the commit
# carrying the Momentum v2 numbers Mo approved. Two later commits then changed
# how the rules behave, so it moved forward to 03e5318. Nine more followed on the
# evening of 2026-09-06, every one of them found by the replay gate and every one
# of them changing what a limit answers, so it moved again to f840f0f: an orphan
# alerts instead of halting, a halt can clear and its reason is bounded, a
# Gateway outage is no longer read as an empty account, a stale quote refuses an
# entry, symbol exclusivity went back to refusing by default, fills come off the
# broker's own executions, and the loop will not send an order it already has
# resting.
#
# It then moved once more, to b04298a, the same night. That commit makes the 15:45
# flatten read what the feed says about itself instead of throwing it away, so a
# market data line taken by another session or a subscription lapsed to delayed
# data now halts the book. A rule that said yes from 15:45 onwards can now say
# no, which is exactly what this stamp is for.
#
# WHY b04298a AND NOT THE NEWEST HASH. Seven commits since f840f0f touch code or
# prose and not one of them moves a limit. Before b04298a: 158bc24 corrects the
# gate's own wording, 41a0c51 wires two database writers and measures how long a
# tick took, d11323c deletes a constant nothing read, 6fc3fd3 widens the launchd
# generator's template glob and produces byte-identical plists. After it: 9254702
# adds a replay scenario and strengthens another, c5c92a2 reverts an uncommitted
# orphan halt back to the committed behaviour and documents it, 5b57b6f is the
# backlog and the journal. That is exactly the "plumbing that leaves every limit
# answering as it did" this rule excludes, so the stamp names the commit where
# the behaviour stopped changing rather than the latest one.
#
# The rule from here: BEFORE THE FIRST TRADE, move this stamp whenever a commit
# changes guardrail behaviour. Not for a typo, a comment or a test, and not for
# plumbing that leaves every limit answering exactly as it did. For anything that
# changes what an order check says yes or no to, move it, because a stamp that
# names a commit whose guardrails have since changed is worse than no stamp: it
# looks like an answer.
#
# AFTER THE FIRST TRADE it stops being housekeeping and becomes a version. From
# then on a rules change is a new approved version with its own entry in the
# strategy's CHANGELOG.md, and the stamp moves with it so every ledger row can
# still be read against the exact limits it was made under.
# A book set to tiny or full without both of them filled in refuses to load, so
# a mode change on its own cannot quietly start sending orders.
#
# Paths here are written from the project folder, the one holding config/ and
# strategies/, which is
# /Users/mtalib/workspace_repos/personal_repo/agentic_trading
#
# The code that reads this file is load_books() and load_book_guardrails() in
# /Users/mtalib/workspace_repos/personal_repo/agentic_trading/agent/guardrails.py

# ---------------------------------------------------------------------------
# THE GO LIVE RAMP (Mo's decision D4, 2026-09-06)
# ---------------------------------------------------------------------------
#
# Mo said he would go live immediately if month one succeeds. This is the
# responsible version of immediately: real money, from the first day, in an
# amount too small to hurt while the machine is still proving itself.
#
# A book that goes live climbs this ladder one rung at a time. Each rung is 10
# COMPLETED TRADING SESSIONS at that fraction of the intended size, and a rung
# is only climbed by Mo editing ramp_step below by hand. No code promotes a
# book, exactly as no code promotes one from dry_run to tiny to full.
#
#   ramp_step 1   10 percent of intended size, for 10 sessions
#   ramp_step 2   25 percent, for 10 sessions
#   ramp_step 3   50 percent, for 10 sessions
#   ramp_step 4   full size
#
# Thirty sessions of climbing is about six weeks of live money before a book
# reaches full size.
#
# GOING BACK DOWN IS NOT A HAND EDIT. Any one of these sends the book straight
# back to paper, not down a rung, and it stays there until Mo has read what
# happened and put it back himself:
#
#   - any guardrail cap was breached
#   - any position could not be reconciled
#   - the loop crashed while holding a position
#   - the daily loss cap was hit twice in five sessions
#   - drawdown went past 8 percent
#   - measured live slippage came in at more than twice what paper showed
#
# The last one is why the ledger's slippage columns matter: without them that
# trigger cannot be measured and the ramp is being climbed blind.
live_ramp:
  steps:                         # fraction of intended size, per rung
    1: 10
    2: 25
    3: 50
    4: 100
  sessions_per_step: 10          # completed trading sessions before the next rung
  demote_to_paper_on:            # any one of these, and the book goes back to paper
    - cap_breach
    - unreconciled_position
    - crash_holding_a_position
    - two_daily_cap_hits_in_five_sessions
    - drawdown_over_8_pct
    - live_slippage_over_twice_paper

# ---------------------------------------------------------------------------
# IBKR'S OWN ORDER PRECAUTIONS (Mo's decision D6, 2026-09-06)
# ---------------------------------------------------------------------------
#
# IB Gateway has its own limits on order size and value, separate from ours.
# Two reviewers disagreed about them: one wanted them bypassed for API orders so
# that this project's caps are the only gate, the other wanted them kept. Mo
# kept them.
#
# So: NEVER bypass IBKR's precautions for API orders. Set each of them just
# ABOVE the matching cap in config/guardrails.yaml, so ours always bites first
# and IBKR's is the second layer underneath. Two layers are cheaper than one
# mistake, and a rejection from IBKR is a loud signal that our own cap has been
# worked around somehow.
#
# A precaution rejection is not a quiet failure to be retried. It goes to the
# alerts as an incident, because by the time IBKR is the thing saying no,
# something upstream has already gone wrong.
#
# The settings live in IB Gateway's own configuration, in
# /Users/mtalib/workspace_repos/personal_repo/agentic_trading/config/ibc.ini,
# and are set when a live account is first funded, not before.

shared:
  account_id: DUT077572          # the one IBKR paper account all five books
                                 # share. Paper account ids start with DU.
  gateway_port: 4002             # IB Gateway listens here for the paper account
  ledger_config: config/ledger.json
                                 # holds the id of the Google Sheet every book
                                 # writes its fills and decisions into
  timezone: America/New_York     # every time in every strategy file is this
  guardrails: config/guardrails.yaml
                                 # the settings all five books start from. A
                                 # book's own strategy.yaml wins wherever the
                                 # two disagree.
  tiny_capital_usd: 2000         # what a book in tiny mode may risk. Written
                                 # once here for all five, and it matches
                                 # money.tiny_capital_usd in
                                 # config/guardrails.yaml. This one wins, the
                                 # same way account_id and gateway_port above
                                 # do, so the two files cannot drift apart.

