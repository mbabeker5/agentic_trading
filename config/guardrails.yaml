# ============================================================================
# PROPOSED VALUES, pending Mo's approval on 2026-09-02.
# Nothing here has been signed off yet. Every number below comes from the
# table in docs/STRATEGY.md and is a starting suggestion, not a decision.
# ============================================================================
#
# What this file is: the hard limits the trading agent is not allowed to break.
# The code in agent/guardrails.py reads this file and checks every single order
# against it before the order can reach IB Gateway. Claude cannot talk its way
# past any of these. If a number here says no, the order does not happen.
#
# To change a limit, edit the number and save. Nothing else to do. Then run the
# tests (see agent/README_guardrails.md) so you know the file still loads.

account:
  mode: paper                 # paper or live. Live also needs the environment
                              # variable AGENTIC_TRADING_ALLOW_LIVE set to yes,
                              # so real money can never start by accident.
  account_id: DUT077572       # the exact IBKR account the agent may touch.
                              # Paper account ids start with DU.
  gateway_port_paper: 4002    # IB Gateway listens here for the paper account
  gateway_port_live: 4001     # and here for a live account

money:
  starting_equity: 100000     # what the paper account is reset to on day one
  max_position_pct: 10        # no single stock may be more than this percent
                              # of the account. 10 percent of 100k is 10k.
  max_open_positions: 5       # at most this many stocks held at the same time
  max_daily_loss_pct: 2       # lose this percent of the day's opening balance
                              # and the agent stops opening new trades that day
  max_order_notional: 10000   # no single buy order may be worth more than this
                              # many dollars

risk:
  stop_loss_pct: 1.5          # every position gets a stop this percent below
                              # the price we bought at
  use_opening_range_low_if_tighter: true
                              # if the low of the first five minutes is nearer
                              # to our entry price than the percent stop above,
                              # use that instead. Tighter stop, smaller loss.

universe:
  price_floor: 5              # ignore anything trading below this many dollars
  min_avg_volume: 1000000     # ignore anything that normally trades fewer than
                              # this many shares a day
  allow_options: false        # no options in month one
  allow_shorts: false         # no betting on falls in month one
  allowed_sec_types: [STK]    # STK means ordinary shares and ETFs
  allowed_currencies: [USD]   # US dollars only
  whitelist: []               # leave empty to allow any symbol that passes the
                              # filters above. Put symbols here and the agent
                              # may trade nothing else.
  blacklist: []               # symbols the agent may never trade, whatever
                              # else says otherwise

scanner:
  rel_volume_min: 2.0         # a candidate must be trading at least this many
                              # times its normal pace for the time of day
  max_candidates: 20          # the shortlist handed to Claude is capped here
  exclude_leveraged_etfs: true  # no 2x or 3x or inverse products

schedule:
  timezone: America/New_York  # every time below is New York time
  scan_start: "09:30"         # market opens, scanner runs
  pick_time: "09:35"          # Claude picks its names, entries may begin
  entries_until: "11:00"      # no new positions opened after this
  flatten_at: "15:55"         # sell everything still open
  market_close: "16:00"       # market shuts
  loop_minutes: 5             # the agent wakes up this often during the day
  trade_only_regular_hours: true  # no pre-market or after-hours trading

kill_switch:
  file: output/STOP           # create this file and the agent will only close
                              # positions, never open one. Delete it to resume.
                              # From the project folder: touch output/STOP
