# ============================================================================
# PROVISIONAL. Every number in this file is a proposal waiting on Mo's
# approval, taken from the parameter table in docs/STRATEGY.md. Nothing here
# has been signed off. status: provisional below says the same thing in a way
# the code can read.
# ============================================================================
#
# Book B runs this, and it is the control in the experiment. Every number below
# is the same as in strategies/momentum_hybrid/strategy.yaml, and the only line
# that differs is discretion: no model is called at all. The code takes the top
# names off the scanner's shortlist in order and follows the rules.
#
# Keep the two files identical apart from that line and the name. If book A
# beats book B it is because the model earned it, and that only means something
# while the rules underneath are the same. A test in
# /Users/mtalib/workspace_repos/personal_repo/agentic_trading/tests/test_books.py
# fails if the two ever drift apart.
#
# Spec: /Users/mtalib/workspace_repos/personal_repo/agentic_trading/docs/STRATEGY.md

strategy:
  status: provisional         # provisional or approved. Mo decides.
  name: Opening momentum, rules only
  spec: docs/STRATEGY.md
  discretion: rules_only      # no model is called at all
  holds_overnight: false      # nothing survives the close
  flat_by_close: true         # everything still open is sold at flatten_at

money:
  starting_equity: 100000     # the book's own pot, not the whole account.
                              # config/books.yaml sets this from capital_usd.
  max_position_pct: 15        # no single stock may be more than this percent
                              # of the book. 15 percent of 100k is 15k.
  max_open_positions: 5       # at most this many stocks held at the same time
  max_daily_loss_pct: 2       # lose this percent of the day's opening balance
                              # and the book stops opening new trades that day
  max_order_notional: 15000   # no single order may be worth more than this
  gross_exposure_pct_max: 100 # longs and shorts added together may never be
                              # worth more than the book itself. With 5
                              # positions at 15 percent the natural ceiling is
                              # 75 percent, so this is a backstop.

risk:
  stop_loss_pct: 1.5          # a long stops 1.5 percent below entry, a short
                              # 1.5 percent above it
  use_opening_range_low_if_tighter: true
                              # if the low of the first five minutes is nearer
                              # to entry than the percentage stop, use it
                              # instead. For a short the range high does the
                              # same job.
  trailing_stop_pct:          # left empty on purpose. docs/STRATEGY.md offers
  trailing_activation_pct:    # "a target or a trailing rule" and sets no
                              # numbers, and the book is flat by 15:55 anyway.
                              # Put a pair of numbers here and the trailing
                              # stop switches itself on.
  time_stop_trading_days: 1   # a position never lives past the close, so one
                              # trading day is the honest number. The 15:55
                              # flatten does the actual work.

universe:
  price_floor: 5              # ignore anything trading below this many dollars
  min_avg_dollar_volume: 20000000
                              # the liquidity floor (Mo, 2026-09-06). A name has
                              # to trade at least this many dollars a day on
                              # average before the scanner will look at it.
                              # Dollars, not shares, because 20 million dollars
                              # means the same thing at 6 dollars a share and at
                              # 600. It replaced a million share floor, which a
                              # census on 2026-09-04 found was the narrower of
                              # the two: about 1,950 US names cleared it against
                              # about 2,700 that clear this one.
  dollar_volume_sessions: 30  # how many completed sessions that average covers
  min_avg_volume: 1000000     # DEPRECATED, kept as an alias so an older file
                              # still loads. The scanner ignores it.
  allow_options: false        # no options in month one
  allow_shorts: false   # shorting deferred to month two pending review (2026-09-06); flip only after the hub confirms
                              # gap up (Mo, 2026-09-02). Switched on here, and
                              # only here, now that the mirrored stop, the
                              # gross exposure cap and the borrow check exist.
                              # config/guardrails.yaml stays false.
  short_price_floor: 10       # shorts only on shares at 10 dollars or more.
                              # Cheap shares are the expensive ones to be short
                              # of: hard to borrow, and they can double in a
                              # morning.
  require_shortable: true     # the easy to borrow rule (Mo, 2026-09-06). All
                              # three of the tests below have to hold at the
                              # moment of entry, and any miss skips the short
                              # and writes down which test failed.
  max_borrow_fee_pct: 1.0     # the borrow has to cost less than this percent a
                              # year. An expensive borrow eats the trade before
                              # it starts.
  borrow_availability_multiple: 10
                              # and the broker has to have at least this many
                              # times our share count available to borrow, so a
                              # thin borrow cannot be recalled out from under us.
                              # The third test is IBKR's own shortable level,
                              # which has to be in its easy to borrow band,
                              # above 2.5 on a scale of 0 to 3. That number is
                              # the broker's, not ours, so it is in the code
                              # rather than here.
  allowed_sec_types: [STK]    # STK means ordinary shares and ETFs
  allowed_currencies: [USD]   # US dollars only
  whitelist: []               # empty means any symbol that passes the filters
  blacklist: []               # symbols this book may never trade

scanner:
  # The scanner sends NO filters to IB Gateway (Mo, 2026-09-06). Every filter we
  # tried on this account made the scan return zero rows while Gateway logged
  # "Scanner filter X is disabled" into a callback nobody reads, which looks
  # exactly like a morning when nothing gapped. The same scan with no filters
  # returns 50 rows in under a second. So every number in this file is applied
  # in our own code against real daily bars, where nothing can switch it off.
  # Four unfiltered scans feed the shortlist: TOP_PERC_GAIN and TOP_PERC_LOSE
  # for the moves, HOT_BY_VOLUME and HIGH_STVOLUME_5MIN for the volume. Gainers
  # become long candidates and fallers become short ones, each row tagged with
  # its direction. See agent/README_scanner.md.
  rel_volume_min: 2.0         # a candidate must be trading at least this many
                              # times its normal pace for the time of day,
                              # measured at 09:35. At or above, not above.
  max_candidates: 20          # the shortlist the rules pick from is capped here
  exclude_leveraged_etfs: true  # no 2x or 3x or inverse products

  finviz:
    # The optional Finviz Elite cross-check, off because Mo has not bought it
    # (39.50 dollars a month). The scanner run is shared by books A, B and E, so
    # this switch only has an effect in config/guardrails.yaml, which is where
    # the scanner reads it from. It is written out here too so a book's settings
    # can be read in one place.
    enabled: false

schedule:
  timezone: America/New_York  # every time below is New York time
  scan_start: "09:30"         # market opens, scanner runs
  pick_time: "09:35"          # the rules pick their names, entries may begin
  entries_until: "11:00"      # no new positions opened after this
  flatten_at: "15:55"         # sell everything still open
  market_close: "16:00"       # market shuts
  loop_minutes: 5             # the book wakes up this often during the day
  trade_only_regular_hours: true  # no pre-market or after-hours trading
  entries_per_day_max: 5      # at most this many brand new names in one day.
                              # Adding to something already held does not count.

pdt:
  # The pattern day trader rule, as this book applies it. Day trading is this
  # book's whole strategy, so it is never blocked. Every order the rule would
  # have blocked is still written down, so the cost of the rule in a live
  # account is measured rather than guessed (Mo, 2026-09-06).
  hard_limit: false           # never block. The insider and Congress books set
                              # this true, because a day trade in a book meant
                              # to hold for weeks is a mistake.

kill_switch:
  file: output/STOP           # create this file and every book only closes
                              # positions, never opens one. Delete it to resume.
